#############################################################
# Azure DevOps Pipeline
#
# Project: Terraform Azure Web App
# Author: Mohammed Farooq
#
# Purpose:
# Validate Terraform
# Generate a Terraform Plan
# Deploy Azure Infrastructure
#############################################################

#############################################################
# Trigger
#
# Run this pipeline automatically whenever code is pushed
# to the main branch.
#############################################################

trigger:
- main

#############################################################
# Agent Pool
#
# Use Microsoft's Ubuntu build agent.
#############################################################

pool:
  vmImage: ubuntu-latest

#############################################################
# Pipeline Variables
#
# Store values that might change in one place.
#############################################################

variables:

  # Terraform version to install
  terraformVersion: '1.9.8'

#############################################################
# Stage 1
#
# Validate Terraform configuration
#############################################################

stages:

- stage: Validate
  displayName: "Terraform Validate"

  jobs:

  ###########################################################
  # Validate Job
  ###########################################################

  - job: Validate
    displayName: "Validate Terraform"

    steps:

    #########################################################
    # Download the GitHub repository
    #########################################################

    - checkout: self

    #########################################################
    # Install Terraform
    #
    # Download Terraform
    # Extract the binary
    # Move it into the Linux PATH
    # Display the installed version
    #########################################################

    - script: |
        wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: Install Terraform

    #########################################################
    # Terraform Validation
    #
    # Login to Azure using the Azure DevOps
    # Service Connection.
    #
    # terraform init
    #   Downloads providers
    #
    # terraform fmt
    #   Checks Terraform formatting
    #
    # terraform validate
    #   Validates Terraform configuration
    #########################################################

    - task: AzureCLI@2
      displayName: Terraform Validate

      inputs:

        # Azure DevOps Service Connection
        azureSubscription: 'devops'

        # Use Bash shell
        scriptType: bash

        # Run commands directly inside the YAML
        scriptLocation: inlineScript

        inlineScript: |
          terraform init
          terraform fmt -check
          terraform validate

#############################################################
# Stage 2
#
# Generate Terraform Execution Plan
#############################################################

- stage: Plan
  displayName: "Terraform Plan"

  # Only run if Validate succeeds
  dependsOn: Validate

  jobs:

  ###########################################################
  # Plan Job
  ###########################################################

  - job: Plan
    displayName: "Generate Terraform Plan"

    steps:

    #########################################################
    # Download repository
    #########################################################

    - checkout: self

    #########################################################
    # Install Terraform
    #########################################################

    - script: |
        wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: Install Terraform

    #########################################################
    # Generate Terraform Plan
    #
    # terraform plan does NOT deploy resources.
    #
    # It creates an execution plan showing what
    # Terraform intends to build.
    #
    # The plan is saved as tfplan.
    #########################################################

    - task: AzureCLI@2
      displayName: Terraform Plan

      inputs:

        azureSubscription: 'devops'

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |
          terraform init
          terraform plan -out=tfplan

    #########################################################
    # Publish the Terraform Plan
    #
    # Save tfplan as a Pipeline Artifact so the
    # Apply stage can download it later.
    #########################################################

    - publish: tfplan
      artifact: terraform-plan

#############################################################
# Stage 3
#
# Deploy Infrastructure
#############################################################

- stage: Apply

  displayName: "Terraform Apply"

  # Only run if the Plan stage succeeds
  dependsOn: Plan

  jobs:

  ###########################################################
  # Apply Job
  ###########################################################

  - job: Apply
    displayName: "Deploy Infrastructure"

    steps:

    #########################################################
    # Download repository
    #########################################################

    - checkout: self

    #########################################################
    # Download the Terraform Plan created in Stage 2
    #########################################################

    - download: current
      artifact: terraform-plan

    #########################################################
    # Install Terraform
    #########################################################

    - script: |
        wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: Install Terraform

    #########################################################
    # Deploy Infrastructure
    #
    # terraform apply
    #
    # Uses the plan generated in the previous stage
    # to deploy Azure infrastructure.
    #########################################################

    - task: AzureCLI@2
      displayName: Terraform Apply

      inputs:

        azureSubscription: 'devops'

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |
          terraform init
          terraform apply -auto-approve