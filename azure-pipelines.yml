#############################################################
# Azure DevOps Pipeline
#
# Project:
# Terraform Azure Web App
#
# Author:
# Mohammed Farooq
#
# Purpose:
# Validate Terraform code and generate an execution plan
# before deploying Azure infrastructure.
#############################################################

#############################################################
# Trigger
#
# Run this pipeline automatically whenever code is pushed
# to the main branch.
#############################################################

trigger:
- main

#############################################################
# Agent Pool
#
# Use Microsoft's hosted Ubuntu build agent.
#############################################################

pool:
  vmImage: 'ubuntu-latest'

#############################################################
# Pipeline Variables
#
# Store reusable values in one place.
#############################################################

variables:
  terraformVersion: '1.9.8'

#############################################################
# Stage 1
#
# Validate the Terraform configuration and generate a plan.
#############################################################

stages:

- stage: Terraform
  displayName: 'Terraform Validation & Plan'

  jobs:

  ###########################################################
  # Job
  #
  # Install Terraform
  # Login to Azure
  # Initialise Terraform
  # Validate Terraform
  # Generate Terraform Plan
  ###########################################################

  - job: Terraform
    displayName: 'Terraform Job'

    steps:

    #########################################################
    # Checkout Repository
    #
    # Downloads the latest code from GitHub into the build
    # agent.
    #########################################################

    - checkout: self

    #########################################################
    # Install Terraform
    #
    # Download the requested Terraform version.
    # Extract the binary.
    # Move Terraform into the Linux PATH.
    # Display the installed version.
    #########################################################

    - script: |
        wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: 'Install Terraform'

    #########################################################
    # Login to Azure
    #
    # Azure DevOps automatically authenticates using the
    # Azure Resource Manager Service Connection.
    #
    # Service Connection:
    # Azure-WebApp-Connection
    #########################################################

    - task: AzureCLI@2
      displayName: 'Terraform Init, Validate & Plan'

      inputs:

        #####################################################
        # Azure Service Connection
        #####################################################

        azureSubscription: 'Azure-WebApp-Connection'

        #####################################################
        # Use Bash on the Ubuntu build agent
        #####################################################

        scriptType: bash

        #####################################################
        # Run commands directly inside the pipeline
        #####################################################

        scriptLocation: inlineScript

        #####################################################
        # Terraform Commands
        #
        # terraform init
        #   - Downloads AzureRM Provider
        #   - Initialises the working directory
        #
        # terraform fmt -check
        #   - Ensures Terraform code follows HashiCorp
        #     formatting standards.
        #
        # terraform validate
        #   - Checks Terraform syntax and configuration.
        #
        # terraform plan
        #   - Shows what resources Terraform will create,
        #     update or destroy.
        #   - Does NOT make any changes to Azure.
        #####################################################

        inlineScript: |
          terraform init
          terraform fmt -check
          terraform validate
          terraform plan