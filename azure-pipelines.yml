#############################################################
# Trigger
# Run this pipeline automatically whenever code is pushed
# to the main branch.
#############################################################

trigger:
- main

#############################################################
# Microsoft-hosted build agent
# Ubuntu is used because Terraform runs well on Linux.
#############################################################

pool:
  vmImage: 'ubuntu-latest'

#############################################################
# Pipeline Variables
# Store values that may change in one place.
#############################################################

variables:
  terraformVersion: '1.9.8'

#############################################################
# Stage 1 - Validate Terraform
#############################################################

stages:

- stage: Validate
  displayName: 'Terraform Validation'

  jobs:

  ###########################################################
  # Job 1 - Validate Terraform Configuration
  ###########################################################

  - job: Validate
    displayName: 'Terraform Validate'

    steps:

    #########################################################
    # Checkout the GitHub repository
    #########################################################

    - checkout: self

    #########################################################
    # Install Terraform
    #
    # Download the Terraform binary
    # Extract it
    # Move it into the Linux PATH
    # Display the installed version
    #########################################################

    - script: |
        wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: 'Install Terraform'

    #########################################################
    # Terraform Init
    #
    # Downloads the AzureRM provider
    # Creates the .terraform folder
    # Initializes the working directory
    #########################################################

    - script: |
        terraform init
      displayName: 'Terraform Init'

    #########################################################
    # Terraform Format Check
    #
    # Checks that all Terraform files follow
    # HashiCorp formatting standards.
    #########################################################

    - script: |
        terraform fmt -check
      displayName: 'Terraform Format Check'

    #########################################################
    # Terraform Validate
    #
    # Checks Terraform syntax and configuration.
    # Does NOT contact Azure.
    #########################################################

    - script: |
        terraform validate
      displayName: 'Terraform Validate'

    #########################################################
    # Terraform Plan
    #
    # Calculates what Terraform will create,
    # modify or destroy.
    #
    # Does NOT create any Azure resources.
    #########################################################

    - script: |
        terraform plan
      displayName: 'Terraform Plan'